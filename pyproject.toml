[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "exoplanet"
version = "0.1.0"
description = "Clasificación de curvas de luz de tránsito (PLANET / FALSE_POSITIVE / NO_SIGNAL)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
